name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag images with (without the leading v)
        required: true

permissions:
  contents: read

jobs:
  push:
    # The full CUDA arch list may not fit a hosted runner's job time limit; set the
    # RELEASE_RUNNER repository variable to a larger or self-hosted runner label.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 720
    strategy:
      max-parallel: 1
      matrix:
        target: [ffmpeg, optical]
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        if: ${{ !vars.RELEASE_RUNNER }}
        with:
          tool-cache: true
      - uses: actions/checkout@v7
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: anarkiwi/nv-optical:${{ steps.version.outputs.version }}-${{ matrix.target }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
