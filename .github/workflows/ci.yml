name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: shellcheck
        run: shellcheck docker/*.sh tests/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: black and pylint
        run: |
          pip install -r tests/requirements-lint.txt
          black --check tests
          pylint tests

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # One SASS arch keeps the OpenCV CUDA build within a hosted runner's time limit;
      # the smoke tests need no GPU, so the arch choice does not affect what they cover.
      CI_CUDA_ARCH_BIN: "12.0"
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ffmpeg
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ffmpeg
          tags: nv-optical:ffmpeg
          load: true
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
      - name: Smoke test ffmpeg
        run: docker run --rm -v "$PWD/tests:/tests:ro" nv-optical:ffmpeg /tests/smoke_ffmpeg.sh
      - name: Build optical
        uses: docker/build-push-action@v7
        with:
          context: .
          target: optical-smoke
          tags: nv-optical:optical-smoke
          load: true
          build-args: |
            CUDA_ARCH_BIN=${{ env.CI_CUDA_ARCH_BIN }}
            CUDA_ARCH_PTX=
          cache-from: |
            type=gha,scope=ffmpeg
            type=gha,scope=optical
          cache-to: type=gha,scope=optical,mode=max
      - name: Smoke test optical
        run: >-
          docker run --rm -v "$PWD/tests:/tests:ro" -e EXPECT_CUDA_ARCH_BIN="$CI_CUDA_ARCH_BIN"
          nv-optical:optical-smoke
          bash -c "/tests/smoke_ffmpeg.sh && python /tests/smoke_optical.py"
